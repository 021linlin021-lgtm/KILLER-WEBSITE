<!DOCTYPE html>
<html>

<head>

    <title>Authorization</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="auth-page">

        <p class="small-text">
            ACCESS REQUEST
        </p >

        <h1>AUTHORIZATION</h1>

        <p class="auth-text">
            Congratulations.<br>
            You have found this archive.
        </p >

        <p class="auth-text">
            Please enter your assigned number.
        </p >

        <input
            type="text"
            id="codeInput"
            placeholder="ENTER NUMBER">
<p id="message"></p >
        <button onclick="enterArchive()">
            AUTHENTICATE
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
